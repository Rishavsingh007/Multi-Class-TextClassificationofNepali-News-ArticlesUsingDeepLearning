# Model Configuration
model:
  name: "xlm-roberta-base"
  num_labels: 20
  max_length: 512
  hidden_size: 768

# Training Configuration
training:
  batch_size: 16
  learning_rate: 2e-5
  num_epochs: 5
  warmup_steps: 500
  weight_decay: 0.01
  dropout: 0.1
  early_stopping_patience: 2

# Data Configuration
data:
  data_dir: "data/raw"
  train_split: 0.7
  val_split: 0.15
  test_split: 0.15
  use_class_weights: true

# Paths
paths:
  model_save_dir: "models/saved_models"
  checkpoint_dir: "models/checkpoints"
  results_dir: "results"
  logs_dir: "logs"
